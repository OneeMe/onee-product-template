name: Quality

# This template ships the quality gate disabled by default so that exploratory
# or short-lived projects created from it do not consume Actions minutes on
# every push or pull request. The job below is fully retained.
#
# For a production project, enable the automated gate by restoring these
# triggers (and removing the manual dispatch):
#
#   on:
#     pull_request:
#     push:
#       branches:
#         - main
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install dependencies
        run: npm install

      - name: Run static checks
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Run integration tests
        run: npm run e2e

      - name: Upload E2E evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: .cache/test-results/e2e/
          if-no-files-found: ignore
          retention-days: 14
